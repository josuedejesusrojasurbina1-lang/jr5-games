<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>jr5 colors</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f0f4f8;color:#1e293b;height:100vh;overflow:hidden}

#home{position:absolute;inset:0;display:flex;flex-direction:column;background:#f8fafc;z-index:50;transition:opacity .3s,transform .3s}
#home.hidden{opacity:0;pointer-events:none;transform:scale(.97)}
.home-header{background:linear-gradient(135deg,#e94560 0%,#ff6b8a 50%,#ff9ff3 100%);padding:24px 20px 32px;color:#fff;text-align:center;box-shadow:0 6px 24px rgba(233,69,96,.35)}
.home-header h1{font-size:2rem;font-weight:800;letter-spacing:-.6px;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.home-header p{font-size:.95rem;opacity:.95;margin-top:6px}
.gallery{flex:1;overflow-y:auto;padding:18px 14px 50px;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.09);cursor:pointer;transition:transform .18s}
.card:active{transform:scale(.95)}
.card-preview{height:130px;display:flex;align-items:center;justify-content:center;font-size:3.3rem;background:linear-gradient(160deg,#f8fafc,#e2e8f0)}
.card-info{padding:11px 13px}
.card-info h3{font-size:.92rem;font-weight:700;margin-bottom:2px}
.card-info span{font-size:.72rem;color:#64748b}

#game{position:absolute;inset:0;display:none;flex-direction:column}
#game.active{display:flex}
.topbar{background:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 14px rgba(0,0,0,.07);z-index:20}
.back-btn,.icon-btn{width:42px;height:42px;border:none;border-radius:50%;background:#f1f5f9;font-size:1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top-title{font-weight:700;font-size:1.05rem;color:#e94560}
.top-actions{display:flex;gap:6px}

.canvas-wrap{flex:1;position:relative;overflow:hidden;background:#dde4ed;display:flex;align-items:center;justify-content:center}
#cv{background:#fff;border-radius:14px;box-shadow:0 14px 45px rgba(0,0,0,.15);touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}

/* Botón Empezar */
.start-overlay{
  position:absolute;inset:0;background:rgba(15,23,42,.45);
  display:flex;align-items:center;justify-content:center;z-index:30;
  transition:opacity .35s;
}
.start-overlay.hidden{opacity:0;pointer-events:none}
.start-btn{
  background:linear-gradient(135deg,#e94560,#ff6b8a);
  color:#fff;border:none;padding:16px 36px;border-radius:40px;
  font-size:1.15rem;font-weight:700;cursor:pointer;
  box-shadow:0 10px 30px rgba(233,69,96,.5);
  display:flex;align-items:center;gap:10px;
}
.start-btn:active{transform:scale(.96)}

.progress-box{background:#fff;padding:9px 16px 5px}
.bar{height:7px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#10b981,#059669);width:0%;transition:width .4s}
.prog-text{font-size:.76rem;color:#64748b;text-align:center;margin-top:4px}

.palette-box{background:#fff;padding:13px 6px 20px;box-shadow:0 -8px 28px rgba(0,0,0,.08);z-index:20}
.palette{display:flex;gap:11px;overflow-x:auto;padding:5px 10px;scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.swatch{flex-shrink:0;width:58px;height:58px;border-radius:50%;border:3.5px solid transparent;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.18rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);box-shadow:0 5px 14px rgba(0,0,0,.2);transition:transform .15s}
.swatch:active{transform:scale(.9)}
.swatch.on{border-color:#0f172a;transform:scale(1.13);box-shadow:0 0 0 3.5px #e94560,0 7px 18px rgba(0,0,0,.28)}
.swatch.done{opacity:.36;pointer-events:none;filter:grayscale(.3)}
.swatch .chk{position:absolute;top:-4px;right:-4px;width:21px;height:21px;background:#10b981;border-radius:50%;font-size:12px;display:none;align-items:center;justify-content:center;color:#fff;border:2.5px solid #fff;font-weight:700}
.swatch.done .chk{display:flex}

.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.93);color:#fff;padding:12px 26px;border-radius:40px;font-size:.92rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .28s;z-index:100}
.toast.show{opacity:1}

.complete-overlay{position:absolute;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:40}
.complete-overlay.show{display:flex}
.complete-card{background:#fff;border-radius:26px;padding:34px 30px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3);max-width:310px}
.complete-card h2{font-size:1.55rem;margin-bottom:8px;color:#e94560}
.complete-card p{color:#64748b;margin-bottom:22px;font-size:.95rem}
.complete-card button{background:linear-gradient(135deg,#e94560,#ff6b8a);color:#fff;border:none;padding:13px 32px;border-radius:32px;font-size:1.02rem;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(233,69,96,.4)}
</style>
</head>

    card.innerHTML=`<div class="card-preview">\( {p.emoji}</div><div class="card-info"><h3> \){p.name}</h3><span>${p.regions.length} zonas</span></div>`;

}

function openPage(i){
  current=i; selected=null; filled={}; history=[];
  scale=1; ox=0; oy=0;
  isPreview = true; // Empezamos en modo preview
  pageTitle.textContent=pages[i].name;
  home.classList.add('hidden');
  setTimeout(()=>{
    home.style.display='none';
    game.classList.add('active');
    // Rellenar todo para mostrar la imagen terminada
    fillAllForPreview();
    startOverlay.classList.remove('hidden');
    resize(); renderPalette(); draw(); updateProgress();
    completeOverlay.classList.remove('show');
  },280);
}

function fillAllForPreview(){
  const page = pages[current];
  page.regions.forEach((_,i)=>{
    filled[current+'-'+i] = true;
  });
}

function startColoring(){
  // Vaciar todo → imagen en blanco con números
  filled = {};
  history = [];
  selected = null;
  isPreview = false;
  startOverlay.classList.add('hidden');
  draw();
  updateProgress();
  renderPalette();
  showToast('¡Ahora colorea tú!');
}

function goHome(){
  game.classList.remove('active');
  home.style.display='flex';
  requestAnimationFrame(()=>home.classList.remove('hidden'));
}
